name: Generate Zelda graph
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npx zelda-contribution-graph --username ${{ github.repository_owner }} --output zelda.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Zelda contribution graph"
